name: 下班提醒（保活版）

on:
  schedule:
    # 周一~四 UTC 9:45 → 北京时间 17:45
    - cron: '45 9 * * 1-4'
    # 周一~四 UTC 10:05 → 北京时间 18:05
    - cron: '05 10 * * 1-4'
    # 周五 UTC 9:00 → 北京时间 17:00
    - cron: '00 9 * * 5'
  workflow_dispatch: # 手动触发

# 👇 这一段是【保活配置】，防止GitHub休眠定时任务
permissions:
  actions: write

jobs:
  # 👇 保活任务：每30天自动更新一次，防止定时失效
  keep-alive:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: 自动保活，避免定时任务休眠
        uses: liskin/gh-workflow-poke@v1
        with:
          token: ${{ github.token }}
          workflow: ${{ github.workflow }}

  send-reminder:
    runs-on: ubuntu-latest
    needs: keep-alive
    steps:
      - name: 发送企微下班提醒
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: |
          # 强制切换为北京时间
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date +%H%M)
          CURRENT_WEEKDAY=$(date +%u)

          # 定义提醒消息
          MESSAGE=""
          if [ $CURRENT_WEEKDAY -ge 1 ] && [ $CURRENT_WEEKDAY -le 4 ]; then
            if [ "$CURRENT_TIME" -ge 1740 ] && [ "$CURRENT_TIME" -le 1750 ]; then
              MESSAGE="🕔 【下班提醒】检查云效任务关闭、工时登记（8小时）、监控表进度更新"
            elif [ "$CURRENT_TIME" -ge 1800 ] && [ "$CURRENT_TIME" -le 1810 ]; then
              MESSAGE="🎉 【下班提醒】检查云效任务、工时登记、监控表进度，加班同学填申报表！"
            fi
          elif [ $CURRENT_WEEKDAY -eq 5 ]; then
            if [ "$CURRENT_TIME" -ge 1655 ] && [ "$CURRENT_TIME" -le 1705 ]; then
              MESSAGE="🕔 【周五愉快】检查云效任务、工时登记、监控表进度，祝大家周末愉快！"
            fi
          fi

          # 发送消息（加固版，防超时、防JSON错误）
          if [ -n "$MESSAGE" ]; then
            echo "✅ 准备发送：$MESSAGE"
            curl -s --connect-timeout 10 --max-time 15 \
              -H "Content-Type: application/json; charset=utf-8" \
              -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WEBHOOK_KEY}" \
              -d "$(jq -n \
                  --arg msg "$MESSAGE" \
                  '{msgtype:"text", text: {content: $msg, mentioned_list:["@all"]}}'
              )"
            echo -e "\n🎉 消息发送完成"
          else
            echo "ℹ️ 当前时间无提醒，跳过"
          fi
