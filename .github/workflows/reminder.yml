name: 下班提醒

on:
  schedule:
    # 周一~四：17:45（UTC 9:45）、18:05（UTC 10:05）
    - cron: '45 9 * * 1-4'
      description: 周一到周四17:45提醒
    - cron: '05 10 * * 1-4'
      description: 周一到周四18:05提醒
    # 周五：17:00（UTC 9:00）
    - cron: '00 9 * * 5'
      description: 周五17:00提醒
  workflow_dispatch: # 手动触发

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 发送企微提醒
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: |
          # 切换到北京时间（避免时区混淆）
          export TZ='Asia/Shanghai'
          # 获取当前北京时间的小时分钟（如 1745）和星期几（1-7，1=周一）
          CURRENT_TIME=$(date +%H%M)
          CURRENT_WEEKDAY=$(date +%u)
          
          # 初始化消息变量
          MESSAGE=""
          
          # 周一到周四的提醒逻辑
          if [ $CURRENT_WEEKDAY -ge 1 ] && [ $CURRENT_WEEKDAY -le 4 ]; then
            # 17:45 提醒（允许±2分钟的误差）
            if [ "$CURRENT_TIME" -ge 1743 ] && [ "$CURRENT_TIME" -le 1747 ]; then
              MESSAGE="🕔 【下班提醒】检查云效任务关闭、工时登记（8小时）、监控表进度更新"
            # 18:05 提醒（允许±2分钟的误差）
            elif [ "$CURRENT_TIME" -ge 1803 ] && [ "$CURRENT_TIME" -le 1807 ]; then
              MESSAGE="🎉 【下班提醒】检查云效任务、工时登记、监控表进度，加班同学填申报表！"
            fi
          # 周五的提醒逻辑
          elif [ $CURRENT_WEEKDAY -eq 5 ]; then
            # 17:00 提醒（允许±2分钟的误差）
            if [ "$CURRENT_TIME" -ge 1658 ] && [ "$CURRENT_TIME" -le 1702 ]; then
              MESSAGE="🕔 【周五愉快】检查云效任务、工时登记、监控表进度，祝大家周末愉快！"
            fi
          fi
          
          # 如果没有匹配到时间，发送测试提醒（仅调试用，正式使用可注释）
          if [ -z "$MESSAGE" ]; then
            MESSAGE="⏰ 【测试提醒】当前时间：$(date)，星期$CURRENT_WEEKDAY，时间$CURRENT_TIME，检查云效任务、工时登记、监控表进度"
          fi
          
          # 发送企微消息
          echo "准备发送消息：$MESSAGE"
          RESPONSE=$(curl -s -X POST \
            "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WEBHOOK_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"text\",
              \"text\": {
                \"content\": \"$MESSAGE\",
                \"mentioned_list\": [\"@all\"]
              }
            }")
          
          # 检查发送结果
          if echo "$RESPONSE" | grep -q "\"errcode\":0"; then
            echo "✅ 发送成功，响应：$RESPONSE"
          else
            echo "❌ 发送失败，响应：$RESPONSE"
            exit 1
          fi
